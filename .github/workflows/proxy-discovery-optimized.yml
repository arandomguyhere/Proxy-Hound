name: Proxy Intelligence System

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'GitHub pages to search'
        required: false
        default: '3'
      max_concurrent:
        description: 'Concurrent validations'
        required: false
        default: '50'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  proxy-discovery:
    name: Discover and Validate Proxies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-minimal.txt'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-minimal.txt
      
      - name: Configure Git
        run: |
          git config --global user.name "ProxyBot"
          git config --global user.email "proxy-bot@users.noreply.github.com"
      
      - name: System Info
        run: |
          echo "System Resources:"
          df -h
          free -h
          echo "Python Environment:"
          python --version
          pip list
      
      - name: Restore Database
        run: |
          if [ -f "proxies.db" ]; then
            if file proxies.db | grep -q "gzip"; then
              echo "Decompressing database"
              mv proxies.db proxies.db.gz
              gunzip proxies.db.gz
            fi
            echo "Database size: $(du -h proxies.db | cut -f1)"
            sqlite3 proxies.db "SELECT COUNT(*) FROM proxies;" 2>/dev/null || echo "Database needs initialization"
          else
            echo "No existing database found"
          fi
      
      - name: Run Proxy Discovery
        env:
          GITHUB_TOKEN: ${{ secrets.PROXY_GITHUB_TOKEN }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
          MAX_CONCURRENT: ${{ github.event.inputs.max_concurrent || '50' }}
          GITHUB_ACTIONS: 'true'
        run: |
          echo "Starting discovery"
          echo "MAX_PAGES: $MAX_PAGES"
          echo "MAX_CONCURRENT: $MAX_CONCURRENT"
          echo "GitHub Token configured: $(echo $GITHUB_TOKEN | head -c 10)"
          python proxy_discovery_optimized.py
      
      - name: Verify Results
        run: |
          echo "Results Summary:"
          if [ -f "proxies.db" ]; then
            if file proxies.db | grep -q "gzip"; then
              cp proxies.db proxies.db.gz
              gunzip proxies.db.gz
            fi
            echo "Database size: $(du -h proxies.db | cut -f1)"
            sqlite3 proxies.db "SELECT COUNT(*) FROM proxies;" 2>/dev/null || echo "Query failed"
            gzip -c proxies.db > proxies.db.gz
            rm proxies.db
            mv proxies.db.gz proxies.db
          fi
          if [ -d "docs" ]; then
            echo "Generated files:"
            ls -la docs/
            if [ -f "docs/proxies.txt" ]; then
              echo "Proxy list lines: $(wc -l < docs/proxies.txt)"
            fi
          fi
      
      - name: Cleanup Files
        run: |
          find . -name "*.tmp" -delete 2>/dev/null || true
          find . -name "*.log" -delete 2>/dev/null || true
          if [ -d "docs" ] && [ -f "docs/proxies.json" ]; then
            SIZE=$(stat -c%s "docs/proxies.json" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 25000000 ]; then
              echo "Truncating large JSON file"
              python3 -c "import json; d=json.load(open('docs/proxies.json')); d['proxies']=d['proxies'][:5000]; json.dump(d,open('docs/proxies.json','w'))"
            fi
          fi
          echo "Repository size: $(du -sh . | cut -f1)"
      
      - name: Commit Results
        run: |
          git add docs/ proxies.db 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "Proxy discovery update $TIMESTAMP"
          echo "Changes committed successfully"
      
      - name: Push Changes
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: git push origin main
      
      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4
      
      - name: Upload to Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      
      - name: Deploy to Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
      
      - name: Create Summary
        run: |
          echo "## Proxy Intelligence Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f docs/stats.json ]; then
            WORKING=$(grep -o '"working_proxies":[^,]*' docs/stats.json | cut -d':' -f2 | tr -d ' ')
            TOTAL=$(grep -o '"total_proxies":[^,]*' docs/stats.json | cut -d':' -f2 | tr -d ' ')
            echo "- Working Proxies: $WORKING" >> $GITHUB_STEP_SUMMARY
            echo "- Total Discovered: $TOTAL" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
