
name: Proxy Intelligence System

on:
  schedule:
    # Run every 8 hours to stay within free tier
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'GitHub pages to search (1-10)'
        required: false
        default: '3'
      max_concurrent:
        description: 'Concurrent validations (10-100)'
        required: false
        default: '50'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  proxy-discovery:
    name: Discover & Validate Proxies
    runs-on: ubuntu-latest
    timeout-minutes: 28
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-minimal.txt'
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-minimal.txt
      
      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "ProxyBot"
          git config --global user.email "proxy-bot@users.noreply.github.com"
      
      - name: 📊 System Info
        run: |
          echo "=== System Resources ==="
          df -h
          free -h
          echo "=== Python Environment ==="
          python --version
          pip list
      
      - name: 🗄️ Restore Database
        run: |
          if [ -f "proxies.db" ]; then
            # Decompress if needed
            if file proxies.db | grep -q "gzip"; then
              echo "Decompressing database..."
              mv proxies.db proxies.db.gz
              gunzip proxies.db.gz
            fi
            
            echo "Existing database found:"
            echo "Size: $(du -h proxies.db | cut -f1)"
            
            # Quick stats
            sqlite3 proxies.db "SELECT 
              COUNT(*) as total,
              COUNT(CASE WHEN is_working=1 THEN 1 END) as working,
              ROUND(COUNT(CASE WHEN is_working=1 THEN 1 END) * 100.0 / COUNT(*), 2) as success_rate
              FROM proxies;" 2>/dev/null || echo "Database needs initialization"
          else
            echo "No existing database found"
          fi
      
      - name: 🔍 Run Proxy Discovery
        env:
          GITHUB_TOKEN: ${{ secrets.PROXY_GITHUB_TOKEN }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
          MAX_CONCURRENT: ${{ github.event.inputs.max_concurrent || '50' }}
          GITHUB_ACTIONS: 'true'
        run: |
          echo "🚀 Starting discovery with:"
          echo "  MAX_PAGES: $MAX_PAGES"
          echo "  MAX_CONCURRENT: $MAX_CONCURRENT"
          echo "  GitHub Token: $(echo $GITHUB_TOKEN | head -c 10)..."
          
          python proxy_discovery_optimized.py
      
      - name: 📈 Verify Results
        run: |
          echo "=== Results Summary ==="
          
          if [ -f "proxies.db" ]; then
            # Decompress if compressed
            if file proxies.db | grep -q "gzip"; then
              cp proxies.db proxies.db.gz
              gunzip proxies.db.gz
            fi
            
            echo "Database size: $(du -h proxies.db | cut -f1)"
            
            # Get detailed stats
            sqlite3 proxies.db "
              SELECT 
                'Total proxies: ' || COUNT(*),
                'Working proxies: ' || COUNT(CASE WHEN is_working=1 THEN 1 END),
                'Success rate: ' || ROUND(COUNT(CASE WHEN is_working=1 THEN 1 END) * 100.0 / COUNT(*), 2) || '%',
                'Countries: ' || COUNT(DISTINCT country)
              FROM proxies;
            " 2>/dev/null || echo "Database query failed"
            
            # Recompress for storage
            if [ ! -f "proxies.db.gz" ]; then
              gzip -c proxies.db > proxies.db.gz
              rm proxies.db
              mv proxies.db.gz proxies.db
            fi
          fi
          
          if [ -d "docs" ]; then
            echo "Generated files:"
            ls -la docs/
            
            if [ -f "docs/proxies.txt" ]; then
              echo "Proxy list size: $(wc -l < docs/proxies.txt) lines"
            fi
          fi
      
      - name: 🧹 Cleanup & Optimize
        run: |
          # Remove any temporary files
          find . -name "*.tmp" -delete 2>/dev/null || true
          find . -name "*.log" -delete 2>/dev/null || true
          
          # Optimize docs for GitHub Pages
          if [ -d "docs" ]; then
            # Ensure files aren't too large for GitHub Pages
            if [ -f "docs/proxies.json" ]; then
              SIZE=$(stat -f%z "docs/proxies.json" 2>/dev/null || stat -c%s "docs/proxies.json" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 25000000 ]; then  # 25MB limit
                echo "JSON file too large, truncating..."
                python3 -c "
import json
with open('docs/proxies.json', 'r') as f:
    data = json.load(f)
data['proxies'] = data['proxies'][:5000]  # Keep top 5000
data['metadata']['note'] = 'Truncated for GitHub Pages size limits'
with open('docs/proxies.json', 'w') as f:
    json.dump(data, f, indent=2)
"
              fi
            fi
          fi
          
          echo "=== Final Repository Size ==="
          du -sh .
          echo "=== Largest Files ==="
          find . -type f -exec du -h {} + | sort -hr | head -10
      
      - name: 💾 Commit Results
        run: |
          # Add generated files
          git add docs/ proxies.db 2>/dev/null || true
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi
          
          # Get stats for commit message
          STATS=""
          if [ -f "docs/stats.json" ]; then
            WORKING=$(grep -o '"working_proxies":[^,]*' docs/stats.json | cut -d':' -f2 | tr -d ' ' 2>/dev/null || echo "0")
            TOTAL=$(grep -o '"total_proxies":[^,]*' docs/stats.json | cut -d':' -f2 | tr -d ' ' 2>/dev/null || echo "0")
            SUCCESS=$(grep -o '"success_rate":[^,]*' docs/stats.json | cut -d':' -f2 | tr -d ' ' 2>/dev/null || echo "0")
            STATS="Working: $WORKING | Total: $TOTAL | Success: $SUCCESS%"
          fi
          
          # Create commit
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "🔍 Proxy discovery update - $TIMESTAMP

📊 Results: $STATS
🤖 Automated via GitHub Actions
⏰ Next run: $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M UTC')"
          
          echo "✅ Changes committed successfully"
      
      - name: 🚀 Push Changes
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: git push origin main
      
      - name: 📄 Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4
      
      - name: 📤 Upload to Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      
      - name: 🌐 Deploy to Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: 📋 Create Summary
        run: |
          echo "## 🔍 Proxy Intelligence Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f docs/stats.json ]; then
            WORKING=$(grep -o '"working_proxies":[^,]*' docs/stats.json | cut -d':' -f2 | tr -d ' ')
            TOTAL=$(grep -o '"total_proxies":[^,]*' docs/stats.json | cut -d':' -f2 | tr -d ' ')
            SUCCESS=$(grep -o '"success_rate":[^,]*' docs/stats.json | cut -d':' -f2 | tr -d ' ')
            COUNTRIES=$(grep -o '"countries":[^,]*' docs/stats.json | cut -d':' -f2 | tr -d ' ')
            
            echo "### 📊 Statistics" >> $GITHUB_STEP_SUMMARY
            echo "- **Working Proxies:** ${WORKING}" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Discovered:** ${TOTAL}" >> $GITHUB_STEP_SUMMARY
            echo "- **Success Rate:** ${SUCCESS}%" >> $GITHUB_STEP_SUMMARY
            echo "- **Countries:** ${COUNTRIES}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### 🔗 Access Points" >> $GITHUB_STEP_SUMMARY
          echo "- [📊 Live Dashboard](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY
          echo "- [📄 Proxy List (TXT)](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/proxies.txt)" >> $GITHUB_STEP_SUMMARY
          echo "- [📊 Proxy Data (JSON)](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/proxies.json)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### ⚡ System Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Runtime:** ~$(( SECONDS / 60 )) minutes" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository Size:** $(du -sh . | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Run:** $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Schedule:** Every 8 hours (free tier optimized)" >> $GITHUB_STEP_SUMMARY
