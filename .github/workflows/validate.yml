name: Validate and Enrich Proxies

on:
  schedule:
    - cron: '30 */6 * * *'  # Offset to run 30 minutes after scrape
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Proxies
        run: |
          python validate_proxies.py

      - name: Export validated proxies
        run: |
          python export_proxies.py

      - name: Commit updated DB and report
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add proxies.db proxies.txt proxies.json docs/index.html
          git commit -m "✅ Proxy validation and enrichment update"
          git push
